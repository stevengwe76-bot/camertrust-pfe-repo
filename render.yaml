# Blueprint Render.com - CamerTrust Lite
# Permet de deployer l'API et une base PostgreSQL gratuite en un clic :
# Render Dashboard -> New -> Blueprint -> selectionner ce repo GitHub.
#
# Si tu preferes une configuration manuelle sans Blueprint, suis DEPLOYMENT.md.

services:
  - type: web
    name: camertrust-api
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: camertrust-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_USERNAME
        value: camertrust
      - key: DEMO_PASSWORD
        sync: false  # a definir manuellement dans le dashboard Render

databases:
  - name: camertrust-db
    plan: free
